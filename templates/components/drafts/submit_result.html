{# Small fragment showing draft submitted status #}
{% from "macros/flowbite_components.html" import flowbite_badge %}
<div class="flex items-center gap-3">
  {{ flowbite_badge("Draft submitted", color="green", size="sm") }}
  <span class="text-xs text-gray-500">Submitted: {{ draft.updated_at.strftime('%Y-%m-%d %H:%M') }}</span>
  <span class="text-xs text-gray-500">Status: {{ draft.status }}</span>
</div>
