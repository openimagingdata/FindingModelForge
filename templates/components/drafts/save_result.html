{# Small fragment showing draft saved status and actions #}
<div class="flex items-center gap-3">
  <span class="inline-flex items-center gap-1 rounded-md bg-blue-100 px-2 py-1 text-sm font-medium text-blue-800 dark:bg-blue-900/30 dark:text-blue-200">
    Saved draft
  </span>
  <span class="text-xs text-gray-500">Updated: {{ draft.updated_at.strftime('%Y-%m-%d %H:%M') }}</span>
  <div class="flex items-center gap-2">
    {% if draft.status == 'draft' %}
    <button
      hx-post="/drafts/{{ draft.id }}/submit"
      hx-target="#draft-actions"
      hx-swap="outerHTML"
      class="px-3 py-1 text-xs rounded bg-green-600 hover:bg-green-700 text-white">
      Submit for review
    </button>
    <button
      hx-post="/drafts/{{ draft.id }}/delete"
      hx-target="#draft-actions"
      hx-swap="outerHTML"
      class="px-3 py-1 text-xs rounded bg-red-600 hover:bg-red-700 text-white">
      Delete draft
    </button>
    {% else %}
    <span class="text-xs text-gray-500">Status: {{ draft.status }}</span>
    {% endif %}
  </div>
</div>
