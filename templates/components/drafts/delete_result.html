{# Small fragment showing delete result #}
<div class="flex items-center gap-3">
  {% if deleted %}
  <span class="inline-flex items-center gap-1 rounded-md bg-gray-200 px-2 py-1 text-sm font-medium text-gray-800 dark:bg-gray-700 dark:text-gray-200">
    Draft deleted
  </span>
  {% else %}
  <span class="inline-flex items-center gap-1 rounded-md bg-yellow-100 px-2 py-1 text-sm font-medium text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-200">
    Could not delete draft
  </span>
  {% endif %}
</div>
