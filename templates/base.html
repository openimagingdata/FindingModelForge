<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finding Model Forge application for Open Imaging Finding Model management">

    <title>{% if title %}{{ title }} - {% endif %}Finding Model Forge</title>

    <!-- Dark mode script - must run before any content renders to prevent flash -->
    <script>
        (function() {
            const isDark = localStorage.getItem('darkMode') === 'true' ||
                          (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <!-- Local Tailwind CSS build with Flowbite -->
    <link href="{{ url_for('static', path='css/output.css') }}" rel="stylesheet">

    <!-- Custom styles -->
    <style>
        /* Alpine.js cloak - must be inline to prevent FOUC */
        [x-cloak] { display: none !important; }
    </style>

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/hammer.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', path='images/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FMForge">
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 flex flex-col">
    <!-- Navigation -->
    {% include 'components/navbar.html' %}

    <!-- Toast Notification Container - Fixed top-right, works on any page -->
    <div id="alert-container" class="fixed top-28 right-8 z-50 w-full max-w-xs"></div>

    <!-- Main Content -->
    <main class="{% if user %}pt-16{% else %}pt-16{% endif %} flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <!-- Bundled JavaScript (includes HTMX, Alpine.js, and app utilities) -->
    <script src="{{ url_for('static', path=vite_asset()) }}" defer></script>

    <!-- Flowbite JavaScript - CDN for compatibility (CSS compiled via Tailwind) -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js" defer></script>

    {% block scripts %}{% endblock %}

    <!-- Global Suggestion Modal -->
    <div id="suggestion-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-2xl max-h-full">
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                <button type="button" class="absolute top-3 end-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="suggestion-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 12 12M13 1 1 13"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
                <div class="p-4 md:p-5">
                    {% include 'components/suggestion_form.html' %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
