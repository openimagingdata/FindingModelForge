{# JSON Accordion Macro using exact Flowbite structure #}
{% macro json_accordion(finding_model, accordion_id="json-accordion", title="JSON Data") %}
<div id="{{ accordion_id }}" data-accordion="collapse"
     data-active-classes="rounded-t-xl"
     data-inactive-classes="rounded-xl">
    <h2 id="{{ accordion_id }}-heading-1">
        <button
            type="button"
            class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-gray-500 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-800 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 gap-3"
            data-accordion-target="#{{ accordion_id }}-body-1"
            aria-expanded="false"
            aria-controls="{{ accordion_id }}-body-1"
        >
            <span>{{ title }}</span>
            <svg
                data-accordion-icon
                class="w-3 h-3 rotate-180 shrink-0"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 10 6"
            >
                <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5 5 1 1 5"
                />
            </svg>
        </button>
    </h2>
    <div
        id="{{ accordion_id }}-body-1"
        class="hidden"
        aria-labelledby="{{ accordion_id }}-heading-1"
    >
        <div class="p-5 border border-t-0 border-gray-200 rounded-b-xl dark:border-gray-700">
            <div class="bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-300 dark:border-gray-600 mb-4" style="max-height: 600px; overflow-y: auto;">
                <pre class="p-4 text-sm font-mono leading-relaxed whitespace-pre-wrap text-gray-800 dark:text-gray-200"><code>{{ finding_model.model_dump_json(indent=2, exclude_none=True) }}</code></pre>
            </div>
            <div class="flex justify-end space-x-2 pt-4 border-t border-gray-200 dark:border-gray-700"
                 x-data="{ jsonData: `{{ finding_model.model_dump_json(indent=2, exclude_none=True) | replace('`', '\\`') }}` }">
                <button type="button"
                        @click="downloadJSON(jsonData, '{{ finding_model.name | replace(' ', '_') | lower }}.fm.json')"
                        class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Download
                </button>
                <button type="button"
                        @click="copyToClipboard(jsonData)"
                        class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    Copy
                </button>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
