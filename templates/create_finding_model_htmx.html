{% extends "base.html" %}

{% block title %}Create Finding Model{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <div class="container mx-auto px-4 py-8 pb-16 max-w-5xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Create Finding Model</h1>
            <p class="text-gray-600 dark:text-gray-400">Build a new finding model through our guided workflow</p>
        </div>

        <!-- HTMX Container for dynamic content -->
        <div id="step-container">
            <!-- Initial content will be loaded here via HTMX -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 border border-gray-200 dark:border-gray-700">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="mt-2 text-gray-600 dark:text-gray-400">Loading creation workflow...</p>
                </div>
            </div>
            <!-- Kick off the creation workflow without custom JS -->
            <div
                hx-post="/api/finding-models/create/restart"
                hx-trigger="load"
                hx-target="#step-container"
                hx-swap="innerHTML"
            ></div>
        </div>


    </div>
</div>
{% endblock %}
