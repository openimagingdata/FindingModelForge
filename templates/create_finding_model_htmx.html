{% extends "base.html" %}

{% block title %}Create Finding Model{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <div class="container mx-auto px-4 py-8 pb-16 max-w-5xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Create Finding Model</h1>
            <p class="text-gray-600 dark:text-gray-400">Build a new finding model through our guided workflow</p>
        </div>

        <!-- HTMX Container for dynamic content -->
        <div id="step-container">
            <!-- Initial content will be loaded here via HTMX -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 border border-gray-200 dark:border-gray-700">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="mt-2 text-gray-600 dark:text-gray-400">Loading creation workflow...</p>
                </div>
            </div>
        </div>


    </div>
</div>

<script>
// Initialize the creation workflow when page loads
document.addEventListener('DOMContentLoaded', function() {
    // Start a new session and load step 1
    fetch('/api/finding-models/create/restart', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        credentials: 'same-origin'
    })
    .then(response => {
        if (response.ok) {
            return response.text();
        } else if (response.status === 401) {
            window.location.href = '/login';
            return null;
        } else {
            throw new Error('Failed to start creation workflow');
        }
    })
    .then(html => {
        if (html) {
            const container = document.getElementById('step-container');
            container.innerHTML = html;

            // Process the new content with HTMX so it can attach event handlers
            if (window.htmx) {
                htmx.process(container);
            }

            // Process with Alpine.js
            if (window.Alpine) {
                Alpine.initTree(container);
            }

            if (typeof initFlowbite === 'function') {
                initFlowbite();
            }
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('step-container').innerHTML = `
            <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700 rounded-md p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800 dark:text-red-200">Error</h3>
                        <p class="mt-1 text-sm text-red-700 dark:text-red-300">Failed to start creation workflow. Please try refreshing the page.</p>
                    </div>
                </div>
            </div>
        `;
    });
});


</script>
{% endblock %}
