<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Creation Flow Test</title>
    <link href="/static/css/output.css" rel="stylesheet">
    <script src="/static/js/main.CmsGGDBI.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">HTMX Creation Flow Test</h1>

        <!-- Progress Indicator -->
        <div class="mb-8">
            <ol class="flex items-center w-full text-sm font-medium text-center text-gray-500 dark:text-gray-400 sm:text-base mb-8">
                <li class="flex md:w-full items-center text-blue-600 dark:text-blue-500 sm:after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
                    <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
                        <span class="me-2">1</span>
                        Name
                    </span>
                </li>
                <li class="flex md:w-full items-center after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
                    <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
                        <span class="me-2">2</span>
                        Description
                    </span>
                </li>
                <li class="flex items-center">
                    <span class="me-2">3</span>
                    Similar
                </li>
            </ol>
        </div>

        <!-- Loading indicator -->
        <div id="step-loading" class="htmx-indicator fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                    <span class="text-gray-900 dark:text-white font-medium">Processing...</span>
                </div>
            </div>
        </div>

        <!-- Step Container -->
        <div id="step-container">
            <!-- This will be populated by HTMX -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6 border border-gray-200 dark:border-gray-700">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Loading...</h2>
                <p class="text-gray-600 dark:text-gray-400 mb-6">Initializing creation workflow...</p>

                <button hx-get="/api/finding-models/create/step/1"
                        hx-target="#step-container"
                        hx-indicator="#step-loading"
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Start Creation Process
                </button>
            </div>
        </div>

        <!-- Debug Section -->
        <div class="mt-8 bg-gray-100 dark:bg-gray-800 rounded-lg p-4">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">Debug Info</h3>
            <div class="text-sm text-gray-600 dark:text-gray-400 space-y-1">
                <div>HTMX Version: <span id="htmx-version">Loading...</span></div>
                <div>Alpine.js Version: <span id="alpine-version">Loading...</span></div>
                <div>Current URL: <span id="current-url"></span></div>
            </div>
        </div>
    </div>

    <script>
        // Debug information
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('htmx-version').textContent = htmx.version || 'Not found';
            document.getElementById('alpine-version').textContent = Alpine.version || 'Not found';
            document.getElementById('current-url').textContent = window.location.href;

            console.log('HTMX:', window.htmx);
            console.log('Alpine:', window.Alpine);
            console.log('Flowbite:', window.initFlowbite);
        });

        // HTMX event logging for debugging
        document.addEventListener('htmx:beforeRequest', function(evt) {
            console.log('HTMX Before Request:', evt.detail);
        });

        document.addEventListener('htmx:afterRequest', function(evt) {
            console.log('HTMX After Request:', evt.detail);
        });

        document.addEventListener('htmx:responseError', function(evt) {
            console.error('HTMX Response Error:', evt.detail);
        });
    </script>
</body>
</html>
