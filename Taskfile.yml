# https://taskfile.dev

version: "3"

vars:
  CONTAINER_NAME: ghcr.io/openimagingdata/findingmodelforge
  DATE_TAG: "{{now | date \"20060102\"}}"
  # Server port (override with PORT env var)
  PORT:
    sh: echo "${PORT:-8000}"
  # Platform-specific data directory (override with FINDINGMODEL_DATA_DIR env var)
  DATA_DIR:
    sh: |
      if [ -n "$FINDINGMODEL_DATA_DIR" ]; then
        echo "$FINDINGMODEL_DATA_DIR"
      elif [ "$(uname)" = "Darwin" ]; then
        echo "$HOME/Library/Application Support/findingmodel"
      else
        echo "$HOME/.local/share/findingmodel"
      fi

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task -l
    silent: true

  install:
    desc: "Install dependencies and setup environment"
    cmds:
      - echo "📦 Installing Python dependencies..."
      - uv sync --all-extras --dev
      - echo "📦 Installing Node.js dependencies..."
      - npm install
      - echo "✅ Dependencies installed!"
    silent: true

  setup:
    desc: "Setup development environment (install deps + create .env + build assets)"
    cmds:
      - task: install
      - |
        if [ ! -f ".env" ]; then
          echo "📝 Creating .env file from template..."
          cp .env.example .env
          echo "⚠️  Please edit .env file with your GitHub OAuth credentials"
        else
          echo "✅ .env file already exists"
        fi
      - echo "🎨 Building frontend assets..."
      - npm run build
      - echo "✅ Setup complete!"
    silent: true

  # Development tasks
  dev:
    desc: "Start development server"
    deps: [_check-port-free]
    cmds:
      - echo "🚀 Starting Finding Model Forge development server..."
      - task: setup
      - echo "🌐 Starting server on http://localhost:{{.PORT}}"
      - echo "📝 Logging output to dev.log"
      - uv run uvicorn app.main:app --host 0.0.0.0 --port {{.PORT}} --reload --proxy-headers --forwarded-allow-ips "*" 2>&1 | tee dev.log
    silent: true

  dev-vite:
    desc: "Start development server with Vite dev mode"
    cmds:
      - echo "🚀 Starting Finding Model Forge with Vite dev mode..."
      - task: setup
      - echo "👀 Starting Vite dev server in background..."
      - npm run dev &
      - echo "🌐 Starting FastAPI server on http://localhost:{{.PORT}}"
      - echo "💡 Vite dev server running on http://localhost:5173"
      - echo "💡 Frontend changes will auto-reload. Press Ctrl+C to stop both processes."
      - uv run uvicorn app.main:app --host 0.0.0.0 --port {{.PORT}} --reload --proxy-headers --forwarded-allow-ips "*"
    silent: true

  dev-watch:
    desc: "Start development server with CSS watch mode"
    cmds:
      - echo "🚀 Starting Finding Model Forge with CSS watching..."
      - task: setup
      - echo "👀 Starting CSS watch mode in background..."
      - npm run watch:css &
      - echo "🌐 Starting server on http://localhost:{{.PORT}}"
      - echo "💡 CSS changes will auto-rebuild. Press Ctrl+C to stop both processes."
      - uv run uvicorn app.main:app --host 0.0.0.0 --port {{.PORT}} --reload --proxy-headers --forwarded-allow-ips "*"
    silent: true

  run:
    desc: "Run the app (alias for dev)"
    cmds:
      - task: dev

  # Frontend tasks
  build-css:
    desc: "Build CSS from Tailwind sources"
    cmds:
      - echo "🎨 Building CSS..."
      - npm run build:css
      - echo "✅ CSS build complete!"
    silent: true

  watch-css:
    desc: "Watch and rebuild CSS on changes"
    cmds:
      - echo "👀 Watching CSS for changes..."
      - npm run watch:css
    silent: true

  watch-js:
    desc: "Watch and rebuild JavaScript on changes (Vite dev mode)"
    cmds:
      - echo "� Starting Vite dev server for JavaScript watching..."
      - npm run dev
    silent: true

  build-frontend:
    desc: "Build all frontend assets (CSS + JS)"
    cmds:
      - echo "🎨 Building frontend assets..."
      - npm run build
      - echo "✅ Frontend build complete!"
    silent: true

  # Code quality tasks
  format:
    desc: "Format code and markdown (fixes formatting issues)"
    cmds:
      - echo "🎨 Formatting Finding Model Forge code..."
      - uv run ruff format .
      - echo "🎨 Formatting Markdown files..."
      - npm run format
      - echo "✅ Code and Markdown formatting complete!"
    silent: true

  format-code:
    desc: "Format Python code only"
    cmds:
      - echo "🎨 Formatting Python code..."
      - uv run ruff format .
      - echo "✅ Code formatting complete!"
    silent: true

  format-markdown:
    desc: "Format Markdown files only"
    cmds:
      - echo "🎨 Formatting Markdown files..."
      - npm run format
      - echo "✅ Markdown formatting complete!"
    silent: true

  lint:
    desc: "Lint and fix code and markdown issues"
    cmds:
      - echo "🎨 Formatting and linting Finding Model Forge code..."
      - uv run ruff format .
      - echo "🔍 Fixing linting issues..."
      - uv run ruff check --fix .
      - echo "🎨 Formatting Markdown files..."
      - npm run format
      - echo "🔎 Running type checking..."
      - uv run mypy .
      - echo "✅ Code and Markdown formatting and linting complete!"
    silent: true

  check:
    desc: "Run quality checks (read-only, for CI)"
    cmds:
      - echo "🔍 Running Finding Model Forge quality checks..."
      - echo "🔍 Checking linting..."
      - uv run ruff check .
      - echo "🎨 Checking code formatting..."
      - uv run ruff format --check .
      - echo "🎨 Checking Markdown formatting..."
      - npm run format:check
      - echo "🔎 Running type checking..."
      - uv run mypy .
      - echo "✅ All quality checks passed!"
    silent: true

  # Testing tasks
  test:
    desc: "Run tests with coverage"
    cmds:
      - echo "🧪 Running Finding Model Forge tests..."
      - echo "📋 Running tests with coverage..."
      - uv run pytest -m "not playwright" --cov=app --cov-report=term-missing --cov-report=html
      - echo "✅ All tests passed!"
    silent: true

  test-unit:
    desc: "Run unit tests only (fast, for development)"
    cmds:
      - echo "⚡ Running unit tests (excluding integration tests)..."
      - uv run pytest -m "not integration and not playwright" --no-cov -q
      - echo "✅ Unit tests passed!"
    silent: true

  test-integration:
    desc: "Run integration tests only"
    cmds:
      - echo "🔗 Running integration tests..."
      - uv run pytest -m "integration and not playwright" --no-cov -q
      - echo "✅ Integration tests passed!"
    silent: true

  _check-port-free:
    desc: "Internal: Ensure port is available"
    internal: true
    cmds:
      - |
        port={{.PORT}}
        if lsof -i :$port -sTCP:LISTEN >/dev/null 2>&1; then
          echo "❌ Port $port is already in use:"
          lsof -i :$port -sTCP:LISTEN
          exit 1
        fi
        echo "✅ Port $port is available"
    silent: true

  health-check:
    desc: "Check if dev server is running and healthy"
    vars:
      RETRIES: '{{.RETRIES | default "0"}}'
      RETRY_DELAY: '{{.RETRY_DELAY | default "2"}}'
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
      - |
        port={{.PORT}}
        retries={{.RETRIES}}
        delay={{.RETRY_DELAY}}
        container="{{.CONTAINER}}"

        for i in $(seq 0 $retries); do
          # If checking a container, verify it's still running (exact name match)
          if [ -n "$container" ]; then
            if ! docker ps --format '{{"{{.Names}}"}}' | grep -qx "$container"; then
              echo "❌ Container '$container' is not running"
              docker logs "$container" 2>&1 | tail -20 || true
              echo ""
              echo "💡 Run 'task run-container-attached' to see full startup output"
              exit 1
            fi
          fi

          response=$(curl -sf http://localhost:$port/api/health 2>/dev/null) || true
          if echo "$response" | grep -q '"status".*"healthy"'; then
            echo "✅ Server is healthy (port $port)"
            exit 0
          fi
          if [ $i -lt $retries ]; then
            echo "⏳ Waiting for server... (attempt $((i+1))/$((retries+1)))"
            sleep $delay
          fi
        done

        if [ -z "$response" ]; then
          echo "❌ Server not running on localhost:$port"
        else
          echo "❌ Server responded but not healthy:"
          echo "   $response"
        fi
        if [ -n "$container" ]; then
          echo ""
          echo "💡 Run 'task run-container-attached' to see full startup output"
        fi
        exit 1
    silent: true

  test-ui:
    desc: "Run all UI/browser tests (organized in tests/ui/)"
    deps: [health-check]
    cmds:
      - echo "🎭 Running UI/browser tests..."
      - uv run pytest tests/ui/ -v --no-cov
      - echo "✅ UI tests passed!"
    silent: true

  test-ui-headed:
    desc: "Run UI tests with visible browser (for debugging)"
    deps: [health-check]
    cmds:
      - echo "🎭 Running UI tests with visible browser..."
      - PLAYWRIGHT_HEADLESS=false uv run pytest tests/ui/ -v --no-cov -s
      - echo "✅ UI tests completed!"
    silent: true

  test-ui-profile:
    desc: "Run only profile page UI tests"
    deps: [health-check]
    cmds:
      - echo "🏠 Running profile page tests..."
      - uv run pytest tests/ui/test_profile.py -v --no-cov
      - echo "✅ Profile tests passed!"
    silent: true

  test-ui-creation:
    desc: "Run only creation workflow UI tests"
    deps: [health-check]
    cmds:
      - echo "⚡ Running creation workflow tests..."
      - uv run pytest tests/ui/test_creation_workflow.py -v --no-cov
      - echo "✅ Creation workflow tests passed!"
    silent: true

  test-ui-drafts:
    desc: "Run only draft management UI tests"
    deps: [health-check]
    cmds:
      - echo "📝 Running draft management tests..."
      - uv run pytest tests/ui/test_draft_management.py -v --no-cov
      - echo "✅ Draft management tests passed!"
    silent: true

  test-ui-comments:
    desc: "Run only comment system UI tests"
    deps: [health-check]
    cmds:
      - echo "💬 Running comment system tests..."
      - uv run pytest tests/ui/test_comments.py -v --no-cov
      - echo "✅ Comment tests passed!"
    silent: true

  # Legacy commands for backward compatibility
  test-playwright:
    desc: "Run all UI tests (alias for test-ui)"
    cmds:
      - task: test-ui

  test-playwright-headed:
    desc: "Run UI tests with visible browser (alias for test-ui-headed)"
    cmds:
      - task: test-ui-headed

  test-full:
    desc: "Run all tests (unit + integration + UI)"
    deps: [health-check]
    cmds:
      - task: test-unit
      - task: test-integration
      - echo "🎭 Running UI/browser tests..."
      - uv run pytest tests/ui/ -v --no-cov
      - echo "✅ All tests passed!"
    silent: true

  # Docker tasks
  build:
    desc: "Build Docker image"
    cmds:
      - echo "🐳 Building Finding Model Forge Docker image..."
      - docker build --platform linux/amd64 -t {{.CONTAINER_NAME}}:latest -t {{.CONTAINER_NAME}}:{{.DATE_TAG}} .
      - echo "📊 Image sizes:"
      - docker images {{.CONTAINER_NAME}} --format "table {{`{{.Repository}}`}}\t{{`{{.Tag}}`}}\t{{`{{.Size}}`}}" | head -6 || echo "No images found"
      - echo "✅ Docker build complete!"
    silent: true

  _validate-container-prereqs:
    desc: "Internal: Validate DuckDB files and container prerequisites"
    internal: true
    cmds:
      - |
        if [ ! -f ".env.container" ]; then
          echo "❌ Missing .env.container file"
          echo "   Copy .env.container.sample to .env.container and fill in your values"
          exit 1
        fi
        echo "✅ Environment file found"
      - echo "📂 Using data directory {{.DATA_DIR}}"
      - |
        if [ ! -f "{{.DATA_DIR}}/finding_models.duckdb" ]; then
          echo "❌ Required file not found: {{.DATA_DIR}}/finding_models.duckdb"
          echo "   Download or build the finding models database first"
          exit 1
        fi
        if [ ! -f "{{.DATA_DIR}}/anatomic_locations.duckdb" ]; then
          echo "❌ Required file not found: {{.DATA_DIR}}/anatomic_locations.duckdb"
          echo "   Download or build the anatomic locations database first"
          exit 1
        fi
        echo "✅ DuckDB files validated"
    silent: true

  run-container:
    desc: "Run the app in a Docker container (detached with health check)"
    deps: [_check-port-free, _validate-container-prereqs]
    cmds:
      - echo "🐳 Starting FindingModelForge container (detached)..."
      - |
        docker run --name findingmodelforge --platform linux/amd64 -d \
          --env-file .env.container \
          -p {{.PORT}}:8000 \
          -v "{{.DATA_DIR}}:/mnt/findingmodel:ro" \
          --rm \
          {{.CONTAINER_NAME}}:latest
      - task: health-check
        vars:
          RETRIES: "15"
          RETRY_DELAY: "2"
          CONTAINER: "findingmodelforge"
      - echo "📋 Use 'docker logs -f findingmodelforge' to follow logs"
      - echo "🛑 Use 'task stop-container' to stop"
    silent: true

  run-container-attached:
    desc: "Run the app in a Docker container (attached for debugging)"
    deps: [_check-port-free, _validate-container-prereqs]
    cmds:
      - echo "🐳 Starting FindingModelForge container (attached - Ctrl+C to stop)..."
      - |
        docker run --name findingmodelforge --platform linux/amd64 \
          --env-file .env.container \
          -p {{.PORT}}:8000 \
          -v "{{.DATA_DIR}}:/mnt/findingmodel:ro" \
          --rm \
          {{.CONTAINER_NAME}}:latest
    silent: true

  stop-container:
    desc: "Stop the running container"
    cmds:
      - docker stop findingmodelforge
      - echo "Container stopped and removed"
    silent: true

  # Utility tasks
  clean:
    desc: "Clean up build artifacts and caches"
    cmds:
      - echo "🧹 Cleaning up Python artifacts..."
      - rm -rf .pytest_cache/ .mypy_cache/ .ruff_cache/ htmlcov/ .coverage
      - echo "🧹 Cleaning up frontend build artifacts..."
      - rm -f static/css/output.css
      - rm -rf static/.vite/ static/js/
      - echo "🧹 Cleaning up Node.js artifacts..."
      - rm -rf node_modules/
      - echo "✅ Cleanup complete!"
    silent: true

  pre-commit:
    desc: "Install and run pre-commit hooks"
    cmds:
      - echo "🔗 Setting up pre-commit..."
      - uv run pre-commit install
      - echo "🔍 Running pre-commit on all files..."
      - uv run pre-commit run --all-files
    silent: true
